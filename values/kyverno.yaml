admissionController:
  replicas: 2
  resources:
    limits:
      memory: 384Mi
    requests:
      cpu: 100m
      memory: 256Mi

backgroundController:
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

cleanupController:
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

reportsController:
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# The chart's pre-delete hook scales Kyverno to 0 and cleans up the dynamic
# webhook configurations Kyverno creates at runtime. We don't need it: when
# we tear down a sandbox the cluster goes with it, so any orphaned webhook
# configs are deleted as part of the cluster delete.
webhooksCleanup:
  enabled: false
